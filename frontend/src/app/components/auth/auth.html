<div class="auth-container">
  
  <div *ngIf="isLoginMode" class="auth-card">
    <h2>Sign In</h2>
    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="loginEmail" [(ngModel)]="loginModel.email" placeholder="Enter your email" required>
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="loginPassword" [(ngModel)]="loginModel.password" placeholder="Enter your password" required>
      </div>
      
      <button type="submit" class="btn-primary">Login</button>
    </form>
    <p>Don't have an account? <span class="toggle-link" (click)="toggleMode()">Sign Up</span></p>
  </div>

  <div *ngIf="!isLoginMode" class="auth-card">
    <h2>Create Account</h2>
    <form (ngSubmit)="onRegister()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="regUser" [(ngModel)]="registerModel.userName" placeholder="Enter username" required>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="regEmail" [(ngModel)]="registerModel.email" placeholder="Enter email" required>
      </div>
      
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="regPassword" [(ngModel)]="registerModel.password" placeholder="Enter password" required>
      </div>
      
      <button type="submit" class="btn-primary">Register</button>
    </form>
    <p>Already have an account? <span class="toggle-link" (click)="toggleMode()">Sign In</span></p>
  </div>

</div>
